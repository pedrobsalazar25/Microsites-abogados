    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FontAwesome for legal and interface icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- Google Fonts: Lora (Modern screen serif for headings) & Plus Jakarta Sans (Modern body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
    <style>
      /* Ensure floating chat button is strictly hidden on mobile viewports (< 768px) */
      @media (max-width: 767px) {
        chat-widget,
        leadconnector-chat-widget,
        #chat-widget-container,
        #chat-widget,
        [id^="chat-widget"],
        [id*="chat-widget"],
        [class*="chat-widget"],
        .lc_text-widget,
        .lc_text-widget--btn,
        .lc_text-widget--bubble,
        .lc_text-widget-container,
        div[id*="leadconnector"],
        div[class*="leadconnector"],
        iframe[src*="leadconnectorhq"],
        iframe[src*="leadconnector"],
        iframe[id*="chat-widget"],
        iframe[title*="Chat" i],
        iframe[title*="LeadConnector" i] {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
          pointer-events: none !important;
          transform: scale(0) !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">
